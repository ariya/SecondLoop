name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Amalgamate, test, and compile-check
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SecondLoop.java
          path: build/SecondLoop.java

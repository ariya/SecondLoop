<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="13">
  <!-- Top view, front up. 14 px per inch: X pod 3 in right of center C, Y pod 7 in behind it. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f6feb"/>
    </marker>
  </defs>
  <rect width="640" height="320" rx="6" fill="#ffffff"/>

  <!-- Robot -->
  <text x="170" y="22" text-anchor="middle" fill="#57606a">front</text>
  <rect x="44" y="34" width="252" height="252" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>

  <!-- Path of P while the robot turns right on the spot -->
  <circle cx="170" cy="160" r="106.6" fill="none" stroke="#1f6feb" stroke-width="1.5" stroke-dasharray="6 5"/>
  <path d="M 64.2 147.4 A 106.6 106.6 0 0 1 97 82.3" fill="none" stroke="#1f6feb" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Pods, and the lines they measure along -->
  <line x1="212" y1="142" x2="212" y2="258" stroke="#8c959f" stroke-dasharray="2 3"/>
  <line x1="142" y1="258" x2="222" y2="258" stroke="#8c959f" stroke-dasharray="2 3"/>
  <rect x="207" y="118" width="10" height="24" rx="2" fill="#57606a"/>
  <text x="224" y="134" fill="#24292f">X pod</text>
  <rect x="118" y="253" width="24" height="10" rx="2" fill="#57606a"/>
  <text x="130" y="280" text-anchor="middle" fill="#24292f">Y pod</text>

  <!-- Offsets, from the center C -->
  <line x1="170" y1="160" x2="212" y2="160" stroke="#cf222e" stroke-width="1.5"/>
  <line x1="212" y1="160" x2="212" y2="258" stroke="#cf222e" stroke-width="1.5"/>
  <text x="191" y="153" text-anchor="middle" fill="#cf222e">x</text>
  <text x="220" y="213" fill="#cf222e">y</text>

  <!-- Center, P, and P half a turn later -->
  <line x1="212" y1="258" x2="128" y2="62" stroke="#1f6feb" stroke-width="1" stroke-dasharray="3 3"/>
  <circle cx="170" cy="160" r="4" fill="#24292f"/>
  <text x="160" y="176" text-anchor="end" fill="#24292f">C</text>
  <circle cx="212" cy="258" r="5" fill="#1f6feb"/>
  <text x="222" y="278" fill="#1f6feb" font-weight="bold">P</text>
  <circle cx="128" cy="62" r="5" fill="#ffffff" stroke="#1f6feb" stroke-width="2"/>
  <text x="142" y="54" fill="#1f6feb" font-weight="bold">P′</text>

  <!-- Explanation -->
  <g fill="#24292f">
    <circle cx="330" cy="66" r="4" fill="#24292f"/>
    <text x="344" y="70"><tspan font-weight="bold">C</tspan>: the center, where the robot turns</text>
    <circle cx="330" cy="106" r="5" fill="#1f6feb"/>
    <text x="344" y="102"><tspan font-weight="bold">P</tspan>: the point the Pinpoint tracks</text>
    <text x="344" y="119">with both offsets 0, where the pod lines cross</text>
    <circle cx="330" cy="152" r="5" fill="#ffffff" stroke="#1f6feb" stroke-width="2"/>
    <text x="344" y="148"><tspan font-weight="bold">P′</tspan>: P after half a turn, on the far side</text>
    <text x="344" y="165">of C: it has moved twice the offsets</text>
    <line x1="322" y1="198" x2="338" y2="198" stroke="#cf222e" stroke-width="2"/>
    <text x="344" y="194"><tspan font-weight="bold" fill="#cf222e">x</tspan>, <tspan font-weight="bold" fill="#cf222e">y</tspan>: the offsets, from C to P</text>
    <text x="344" y="211">(here x = −3 in, y = −7 in)</text>
    <line x1="322" y1="244" x2="338" y2="244" stroke="#1f6feb" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="344" y="240">The circle P follows: its center is C and</text>
    <text x="344" y="257">its radius is the distance from C to P</text>
  </g>
</svg>

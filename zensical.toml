[project]
site_name = "Second Loop"
docs_dir = "docs"
site_dir = "site"
nav = [
  { "Overview" = "index.md" },
  { "Examples" = "examples.md" },
  { "Language" = [
    { "Syntax" = "language/basics.md" },
    { "Functions" = "language/functions.md" },
    { "Branching" = "language/branching.md" },
    { "Loop" = "language/loops.md" },
    { "Exceptions" = "language/exceptions.md" },
    { "Collections" = "language/collections.md" },
    { "Atom" = "language/atom.md" },
    { "Strings" = "language/strings.md" },
  ] },
  { "On the Robot" = [
    { "Telemetry" = "robot/telemetry.md" },
    { "Control Loops" = "robot/control-loops.md" },
    { "Gamepad" = "robot/gamepad.md" },
    { "Motors" = "robot/motors.md" },
    { "Servos" = "robot/servos.md" },
    { "Battery" = "robot/battery.md" },
    { "IMU" = "robot/imu.md" },
    { "Time" = "robot/time.md" },
    { "Errors" = "robot/errors.md" },
    { "Futures" = "robot/futures.md" },
  ] },
  { "Reference" = [
    { "Function Reference" = "reference/functions.md" },
    { "REPL" = "reference/repl.md" },
    { "Differences" = "reference/differences.md" },
  ] },
  { "Development" = "development.md" },
]

[project.theme]
font = false
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.instant",
  "navigation.sections",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
toc.permalink = true
pymdownx.highlight = {}
pymdownx.superfences = {}
